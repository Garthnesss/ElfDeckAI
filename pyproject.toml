[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elfdeckai"
dynamic = ["version"]
description = "Virtual keyboard, gamepad and mouse for AI agents on Linux and Steam Deck: zero-dependency uinput daemons with an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Garth Elfstrom" },
]
keywords = ["mcp", "model-context-protocol", "llm", "ai-agent", "steam-deck", "uinput", "gamepad", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Garthnesss/ElfDeckAI"
Repository = "https://github.com/Garthnesss/ElfDeckAI"
Issues = "https://github.com/Garthnesss/ElfDeckAI/issues"

[project.scripts]
elfkey = "elfkey:main"
elfpad = "elfpad:main"
elfmouse = "elfmouse:main"
elfdeckai-mcp = "elfdeckai_mcp:main"

[tool.setuptools]
py-modules = ["elfkey", "elfpad", "elfmouse", "elfdeckai_mcp"]

[tool.setuptools.dynamic]
version = { attr = "elfdeckai_mcp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
