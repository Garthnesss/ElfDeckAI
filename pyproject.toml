[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elfdeckai"
version = "1.0.2"
description = "Virtual keyboard, gamepad and mouse for AI agents on Linux / Steam Deck — zero-dependency uinput daemons with an MCP server."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Garth Elfstrom" },
]
keywords = ["mcp", "model-context-protocol", "llm", "ai-agent", "steam-deck", "uinput", "gamepad", "automation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Garthnesss/ElfDeckAI"
Repository = "https://github.com/Garthnesss/ElfDeckAI"
Issues = "https://github.com/Garthnesss/ElfDeckAI/issues"

[tool.setuptools]
py-modules = ["elfkey", "elfpad", "elfmouse", "elfdeckai_mcp"]

[project.scripts]
elfkey = "elfkey:main"
elfpad = "elfpad:main"
elfmouse = "elfmouse:main"
elfdeckai-mcp = "elfdeckai_mcp:main"
